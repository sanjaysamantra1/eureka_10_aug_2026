<script>
    for (var i = 1; i <= 3; i++) {
        console.log('inside for loop i: ', i)
    }
    console.log('outside for loop i: ', i); // accessible - yes 


    for (let j = 1; j <= 3; j++) {
        console.log('inside for loop j: ', j)
    }
    console.log('outside for loop j: ', j); // accessible - no 
</script>
