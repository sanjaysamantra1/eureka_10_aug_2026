<body>
    <h1>Count: <span>0</span></h1>

    <button onclick="increment()">increment</button>
    <button onclick="sayHi()">sayHi</button>

    <script>
        let count = 0;
        function increment() {
            count++;
            document.querySelector('span').innerHTML = count;
        }
        function sayHi() {
            console.log('Hiiii');
            count++;
            document.querySelector('span').innerHTML = count;
        }
    </script>
</body>
