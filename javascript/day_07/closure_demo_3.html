<body>
    <h1>Count: <span>0</span></h1>

    <button onclick="increment()">increment</button>
    <button onclick="sayHi()">sayHi</button>

    <script>
        function initializeCount() {
            let count = 0;
            return function () {
                count++;
                document.querySelector('span').innerHTML = count;
            }
        }
        let increment = initializeCount();
        console.dir(increment)

        function sayHi() {
            console.log('Hiiii');
            count++;
            document.querySelector('span').innerHTML = count;
        }
    </script>
</body>
