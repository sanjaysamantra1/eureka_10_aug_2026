<script>
    let arr1 = [20, 50, 10, 40, 30];
    arr1.sort();
    console.log('Sorted arr1: ', arr1);

    let arr2 = [101, 102, 9, 91, 7, 8, 6, 61, 103, 104, 4];
    arr2.sort();
    console.log('Sorted arr2: ', arr2);

    // Numeric Sort
    arr2.sort((a, b) => a - b); // ascending
    console.log('Sorted arr2: ', arr2);

    // Numeric Sort
    arr2.sort((a, b) => b - a); // descending
    console.log('Sorted arr2: ', arr2);
</script>
