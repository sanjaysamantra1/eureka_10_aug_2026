<script>
  // write a function that can add any # of args
  function add(...arr) {
    let sum = 0;
    for (ele of arr) {
      sum = sum + ele;
    }
    console.log(`Sum is: ${sum}`);
  }
  add(10, 20, 30);
  add(10, 20, 30, 40);
  add(10, 20, 30, 40, 50);

  
// when ... is seen as function param, that is REST
</script>
