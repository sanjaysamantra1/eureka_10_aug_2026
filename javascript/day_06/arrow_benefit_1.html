<script>
    class Student {
        firstName = 'Virat'
        lastName = 'Kohli'

        fullName1() { // this = how/where the function is called
            console.log('fullname-1', this);  // this = student
            console.log(this.firstName, this.lastName);
        }
        fullName2 = () => { // this = where the function is written 
            console.log('fullname-2', this); // this = student
            console.log(this.firstName, this.lastName);
        }
    }

    let std = new Student()
    std.fullName1()
    std.fullName2()
</script>
