<script>
    let str = 'This is Javascript Class';

    console.log(str.slice(8, 18));    // Javascript
    console.log(str.substring(8, 18)); // Javascript

    console.log(str.slice(8)) // Javascript Class
    console.log(str.substring(8)) // Javascript Class

    console.log(str.slice(-5)); // Class
    console.log(str.substring(-5)) // This is Javascript Class

    // slice() works with -ve index also , but substring() doesn't
</script>
