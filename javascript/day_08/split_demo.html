<script>
    let str = 'This is Javascript Class';

    // split() returns []

    console.log(str.split(' ')); // ['This', 'is', 'Javascript', 'Class']
    console.log(str.split(''));  // ['T','h','i']
    console.log(str.split('This'));  // ['' , ' is Javascript Class']
    console.log(str.split('Class'));  // ['This is Javascript ','']
    console.log(str.split('Java'));  // ['This is ','script Class']
</script>
